    # --- NGUYENBINHOFFICIAL: nguyenbinhofficial.com.vn ---
    # Cau hinh TAM (chua co SSL): chi phuc vu HTTP de Let's Encrypt xac minh ten mien va xem truoc site.
    # Sau khi cap chung chi (deploy/enable-ssl.sh) file nay duoc thay bang nguyenbinhofficial.conf.

    server {
        listen 80;
        server_name nguyenbinhofficial.com.vn www.nguyenbinhofficial.com.vn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $nb_web http://nguyenbinh-web:3000;
        set $nb_api http://nguyenbinh-api:8080;
        set $nb_admin http://nguyenbinh-admin:80;

        client_max_body_size 220M;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        location /api/ { proxy_pass $nb_api; proxy_read_timeout 300s; proxy_request_buffering off; }
        location /media/ { proxy_pass $nb_api; }
        location /health/ { proxy_pass $nb_api; }
        location = /admin { return 301 /admin/; }
        location /admin/ { proxy_pass $nb_admin; }
        location / { proxy_pass $nb_web; }
    }
    # --- NGUYENBINHOFFICIAL END ---
