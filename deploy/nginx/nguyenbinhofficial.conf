    # --- NGUYENBINHOFFICIAL: nguyenbinhofficial.com.vn ---
    # Chen vao http{} cua nginx dung chung (AciPlatform/nginx.conf) bang deploy/install-nginx.sh.
    # Dung bien + resolver Docker: nginx chi phan giai ten container luc co request, nen khi container
    # Nguyen Binh dung/khoi dong lai, nginx dung chung (va cac site khac) KHONG bi loi khi reload/khoi dong.

    server {
        listen 80;
        server_name nguyenbinhofficial.com.vn www.nguyenbinhofficial.com.vn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://nguyenbinhofficial.com.vn$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name www.nguyenbinhofficial.com.vn;

        ssl_certificate /etc/nginx/ssl/live/nguyenbinhofficial.com.vn/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/nguyenbinhofficial.com.vn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://nguyenbinhofficial.com.vn$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name nguyenbinhofficial.com.vn;

        ssl_certificate /etc/nginx/ssl/live/nguyenbinhofficial.com.vn/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/nguyenbinhofficial.com.vn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        add_header Strict-Transport-Security "max-age=31536000" always;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $nb_web http://nguyenbinh-web:3000;
        set $nb_api http://nguyenbinh-api:8080;
        set $nb_admin http://nguyenbinh-admin:80;

        # Upload media (video toi 200MB).
        client_max_body_size 220M;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        location /api/ {
            proxy_pass $nb_api;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_request_buffering off;
        }

        location /media/ {
            proxy_pass $nb_api;
        }

        location /health/ {
            proxy_pass $nb_api;
        }

        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            proxy_pass $nb_admin;
        }

        location / {
            proxy_pass $nb_web;
        }
    }
    # --- NGUYENBINHOFFICIAL END ---
